StylesPath = styles
MinAlertLevel = suggestion
Vocab = PaperMoon, Polkadot

# Vale rules and the PaperMoon vocab in styles/PaperMoon/ and
# styles/config/vocabularies/PaperMoon/ are VENDORED (committed) in this repo,
# so linting is self-contained — no external fetch at lint time.
# Originally from papermoonio/documentation-style-guide (BSD 2-Clause, see
# styles/PaperMoon/LICENSE). To refresh from upstream, run
# ./.github/scripts/sync-styleguide-vale.sh then commit the result.
#
# To also lint against Google's style, run `vale sync` after adding:
#   Packages = Google
# then add `Google` to the BasedOnStyles list below.

[*.md]
BasedOnStyles = Vale, PaperMoon

# Vale.Spelling (Hunspell) is disabled: this repo enforces house style,
# not spelling. On a deeply technical docs repo the spell-checker flags an
# endless tail of valid tool/package names (npm, toolchain, Turbopack, ...)
# with no typo-catching benefit worth the vocab-curation toil. The curated
# PaperMoon house-style rules and Vale.Repetition stay enabled.
Vale.Spelling = NO

# Vale.Terms (built-in) is disabled: it enforces the exact casing of every
# entry in the vocabulary accept lists, which hold the lowercase running-prose
# forms (parachain, runtime, validator, ...). The rule has no notion of
# sentence position, headings, proper nouns, or domain names, so it flags
# correct text: glossary entry headings (## Runtime), sentence starts
# ("Pallets bundle ..."), external page titles (Polkadot Collator Wiki), and
# every repo, package, and domain built on the word polkadot (polkadot-sdk,
# polkadot.com, polkadot.js). That was 608 errors across docs/, effectively
# all false positives, and "fixing" them would lowercase glossary headings and
# rewrite domain names. House terminology is enforced by the curated
# PaperMoon.Terminology rule instead.
Vale.Terms = NO

TokenIgnores = (?:dApp|TestNet|MainNet|ERC-\d+|JSON-RPC)
BlockIgnores = (?s) *(```.*?```)

# AGENTS.md describes the rules and references banned content by name;
# it is not subject to its own rules.
[AGENTS.md]
BasedOnStyles =
