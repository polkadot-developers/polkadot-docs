# Variables that can be reused should be added to this file
dependencies:
  repositories:
    zombienet:
      repository_url: https://github.com/paritytech/zombienet
      version: v1.3.140
      architecture: macos-arm64
    polkadot_sdk_solochain_template:
      repository_url: https://github.com/paritytech/polkadot-sdk-solochain-template
      version: v0.0.2
    srtool:
      repository_url: https://github.com/paritytech/srtool
      version: v0.18.4
      docker_image_name: paritytech/srtool
      docker_image_version: 1.93.0
    polkadot_sdk:
      repository_url: https://github.com/paritytech/polkadot-sdk
      version: polkadot-stable2609
      docker_image_version: stable2609
    open_zeppelin_contracts:
      repository_url: https://github.com/OpenZeppelin/openzeppelin-contracts
      version: v5.6.1
    polkadot_sdk_contracts_node:
      repository_url: https://github.com/paritytech/polkadot-sdk
      version: polkadot-stable2503-6
      commit_dev_node: 8e2b6f742a38bb13688e12abacded0aab2dbbb23
      ignore_updates: true
    polkadot_sdk_parachain_template:
      repository_url: https://github.com/paritytech/polkadot-sdk-parachain-template
      version: v0.0.5
      # Subdependencies are pinned to versions from the template's Cargo.lock.
      # Update these only when a new template version is released.
      subdependencies:
        polkadot_sdk_version: polkadot-stable2512-2
        polkadot_omni_node_version: 0.13.2
        staging_chain_spec_builder_version: 16.0.0
        frame_omni_bencher_version: 0.17.3
        rust_version: "1.88"
        rust_toolchain_macos: 1.88-aarch64-apple-darwin
        rust_toolchain_ubuntu: 1.88.0
  crates:
    subxt:
      name: subxt
      version: 0.50.1
    subxt_cli:
      name: subxt-cli
      version: 0.50.1
    subxt_signer:
      name: subxt-signer
      version: 0.50.1
    tokio:
      name: tokio
      version: 1.44.2
      ignore_updates: true
    polkadot_omni_node:
      name: polkadot-omni-node
      # Matches the crate version shipped in polkadot_sdk.version; update it with the SDK.
      version: 0.21.0
      ignore_updates: true
  javascript_packages:
    chopsticks:
      name: '@acala-network/chopsticks'
      version: 1.5.2
    moonwall:
      name: '@moonwall/cli'
      version: 5.18.3
    polkadot_js_api:
      name: '@polkadot/api'
      version: 17.0.2
    polkadot_api:
      name: polkadot-api
      version: 3.3.0
    resolc:
      name: '@parity/resolc'
      version: 1.4.0
    hardhat_polkadot:
      name: '@parity/hardhat-polkadot'
      version: 0.3.0
    solc:
      name: 'solc'
      # Used by the ethers.js, Web3.js, and viem pages, which compile EVM bytecode
      # with plain solc. Not tied to resolc, which declares its own solc range.
      version: 0.8.38
    web3_js:
      name: web3
      version: 4.16.0
    viem:
      name: viem
      version: 2.57.8
    ethersjs:
      name: ethers
      version: 6.17.0
    paraspell_sdk:
      name: '@paraspell/sdk'
      version: 14.4.4
    hdkd:
      name: '@polkadot-labs/hdkd'
      version: 0.0.32
    hdkd_helpers:
      name: '@polkadot-labs/hdkd-helpers'
      version: 0.0.34
    polkadot_util:
      name: '@polkadot/util'
      version: 14.0.3
    polkadot_util_crypto:
      name: '@polkadot/util-crypto'
      version: 14.0.3
    polkadot_keyring:
      name: '@polkadot/keyring'
      version: 14.0.3
#   python_packages:
